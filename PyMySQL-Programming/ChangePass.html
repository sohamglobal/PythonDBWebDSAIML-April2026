<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card-custom {
      border: none;
      border-radius: 1.25rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }

    .btn-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
      color: white;
    }

    .form-control:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.25);
    }

    .input-group-text {
      background-color: transparent;
      border-right: none;
    }

    .has-icon .form-control {
      border-left: none;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container" style="max-width: 480px;">
    <div class="card card-custom p-4 p-md-5">
      
      <!-- Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-gradient text-white rounded-circle mb-3" style="width: 60px; height: 60px;">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h3 class="fw-bold text-dark">Change Password</h3>
        <p class="text-muted small">Update your account credentials</p>
      </div>

      <!-- Change Password Form -->
      <form id="changePasswordForm">
        
        <!-- User ID -->
        <div class="mb-3">
          <label for="userid" class="form-label fw-semibold text-secondary small">User ID</label>
          <div class="input-group has-icon">
            <span class="input-group-text text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="userid" placeholder="Enter your User ID" required>
          </div>
        </div>

        <!-- Current Password -->
        <div class="mb-3">
          <label for="currpass" class="form-label fw-semibold text-secondary small">Current Password</label>
          <div class="input-group has-icon">
            <span class="input-group-text text-muted"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control" id="currpass" placeholder="••••••••" required>
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-4">
          <label for="newpass" class="form-label fw-semibold text-secondary small">New Password</label>
          <div class="input-group has-icon">
            <span class="input-group-text text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="newpass" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-gradient w-100 py-2.5 fw-bold rounded-3">
          <span id="btnText">Update Password</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>

      </form>

      <!-- Response Alert Container -->
      <div id="responseArea" class="mt-4 d-none">
        <div id="alertBox" class="alert d-flex align-items-center mb-0" role="alert">
          <i id="alertIcon" class="bi flex-shrink-0 me-2 fs-5"></i>
          <div>
            <strong id="alertTitle"></strong>
            <pre id="jsonOutput" class="mb-0 mt-1 small" style="white-space: pre-wrap; font-family: inherit;"></pre>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript logic -->
  <script>
    document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const responseArea = document.getElementById('responseArea');
      const alertBox = document.getElementById('alertBox');
      const alertIcon = document.getElementById('alertIcon');
      const alertTitle = document.getElementById('alertTitle');
      const jsonOutput = document.getElementById('jsonOutput');

      // Show loading spinner
      submitBtn.disabled = true;
      btnText.innerText = "Updating...";
      btnSpinner.classList.remove('d-none');
      responseArea.classList.add('d-none');

      // Prepare form data (URL-encoded form parameters)
      const formData = new URLSearchParams();
      formData.append('userid', document.getElementById('userid').value);
      formData.append('currpass', document.getElementById('currpass').value);
      formData.append('newpass', document.getElementById('newpass').value);

      try {
        const response = await fetch('http://127.0.0.1:5000/user/change', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: formData
        });

        const data = await response.json();

        // Reveal the response box
        responseArea.classList.remove('d-none');

        if (response.ok && data.status === 'success') {
          alertBox.className = "alert alert-success d-flex align-items-center mb-0";
          alertIcon.className = "bi bi-check-circle-fill flex-shrink-0 me-2 fs-5";
          alertTitle.innerText = "Success!";
          jsonOutput.innerText = JSON.stringify(data, null, 2);
          document.getElementById('changePasswordForm').reset();
        } else {
          alertBox.className = "alert alert-danger d-flex align-items-center mb-0";
          alertIcon.className = "bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-5";
          alertTitle.innerText = "Error!";
          jsonOutput.innerText = JSON.stringify(data, null, 2);
        }

      } catch (error) {
        // Handle network error / server unreachable
        responseArea.classList.remove('d-none');
        alertBox.className = "alert alert-danger d-flex align-items-center mb-0";
        alertIcon.className = "bi bi-wifi-off flex-shrink-0 me-2 fs-5";
        alertTitle.innerText = "Connection Failed";
        jsonOutput.innerText = "Could not connect to the Flask server at http://127.0.0.1:5000";
      } finally {
        // Reset button state
        submitBtn.disabled = false;
        btnText.innerText = "Update Password";
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
