<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recruiters Home - Job Portal</title>
  
  <!-- Bootstrap 5 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
  
  <!-- Custom Styles for Gradient & Design -->
  <style>
    body {
      /* Green to Blue Gradient Background */
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 50%, #0072ff 100%);
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      border: none;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .btn-custom {
      background: linear-gradient(90deg, #11998e 0%, #0072ff 100%);
      color: #ffffff;
      border: none;
      font-weight: 600;
      transition: opacity 0.3s ease;
    }

    .btn-custom:hover {
      color: #ffffff;
      opacity: 0.9;
    }

    .form-control:focus {
      border-color: #11998e;
      box-shadow: 0 0 0 0.25rem rgba(17, 153, 142, 0.25);
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">

  <div class="container">
    <div class="row justify-content-center">
      <!-- Mobile-first column width: full width on mobile, maxes out nicely on larger screens -->
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        
        <!-- Header -->
        <div class="text-center text-white mb-4">
          <h1 class="fw-bold display-6">Recruiters Home</h1>
          <p class="lead text-light fs-6">Post jobs, track applications, and find top talent.</p>
        </div>

        <!-- Login Card -->
        <div class="card shadow-lg bg-white p-4 p-sm-5">
          <div class="card-body p-0">
            
            <h2 class="h4 text-dark text-center mb-4 fw-semibold">Sign In to Your Account</h2>

            <form action="/login/" method="POST">
                {% csrf_token %}
              <!-- Email Input -->
              <div class="mb-3">
                <label for="email" class="form-label text-secondary small fw-bold">UserID</label>
                <input 
                  type="text" 
                  class="form-control form-control-lg fs-6" 
                  name="userid" 
                  placeholder="Enter UserID" 
                  required 
                  autocomplete="off"

                />
              </div>

              <!-- Password Input -->
              <div class="mb-3">
                <label for="password" class="form-label text-secondary small fw-bold">PASSWORD</label>
                <input 
                  type="password" 
                  class="form-control form-control-lg fs-6" 
                  name="password" 
                  placeholder="Enter your password" 
                  required 
                />
              </div>

              <!-- Remember Me & Forgot Password -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe" />
                  <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="small text-decoration-none text-primary">Forgot password?</a>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom btn-lg fs-6">Log In</button>
              </div>
            </form>

            <!-- Registration Link -->
            <div class="text-center mt-4">
              <p class="text-muted small mb-0">
                New to the platform? 
                <a href="/register" class="fw-bold text-decoration-none text-success">Register as a Recruiter</a>
              </p>
            </div>

          </div>
        </div>

        <!-- Footer Note -->
        <div class="text-center text-white-50 mt-4 small">
          &copy; Job Portal for Recruiters. All rights reserved.
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
