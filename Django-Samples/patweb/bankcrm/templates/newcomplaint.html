<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>New Complaint</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>
	<body>
		<div class="container my-5">
			<div class="row justify-content-center">
				<div class="col-md-8">
					<div class="card shadow-sm">
						<div class="card-body">
							<h3 class="card-title mb-4">Lodge New Complaint</h3>
							<form method="post" action="/addcomplaint/">
								{% csrf_token %}
								<div class="mb-3">
									<label for="account_number" class="form-label">Account Number</label>
									<input type="text" class="form-control" id="account_number" name="account_number" required>
								</div>

								<div class="mb-3">
									<label for="name" class="form-label">Name</label>
									<input type="text" class="form-control" id="name" name="name" required>
								</div>

								<div class="mb-3">
									<label for="category" class="form-label">Category</label>
									<select class="form-select" id="category" name="category" required>
										<option value="" selected disabled>Choose category</option>
										<option>Account</option>
										<option>Credit Card</option>
										<option>ATM</option>
										<option>UPI</option>
										<option>NetBanking</option>
										<option>KYC</option>
									</select>
								</div>

								<div class="mb-3">
									<label class="form-label">Priority</label>
									<div>
										<div class="form-check form-check-inline">
											<input class="form-check-input" type="radio" name="priority" id="priority_low" value="Low" checked>
											<label class="form-check-label" for="priority_low">Low</label>
										</div>
										<div class="form-check form-check-inline">
											<input class="form-check-input" type="radio" name="priority" id="priority_medium" value="Medium">
											<label class="form-check-label" for="priority_medium">Medium</label>
										</div>
										<div class="form-check form-check-inline">
											<input class="form-check-input" type="radio" name="priority" id="priority_high" value="High">
											<label class="form-check-label" for="priority_high">High</label>
										</div>
									</div>
								</div>

								<div class="mb-3">
									<label for="complaint" class="form-label">Complaint</label>
									<textarea class="form-control" id="complaint" name="complaint" rows="5" required></textarea>
								</div>

								<div class="d-flex justify-content-between align-items-center">
									<a href="/crm/" class="btn btn-outline-secondary">Back to Home</a>
									<button type="submit" class="btn btn-primary">Submit Complaint</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
