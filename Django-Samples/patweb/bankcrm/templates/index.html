<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Bank CRM System</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
		<style>
			body { background-color: #f8fafc; }
			.hero { background: linear-gradient(90deg,#0d6efd22,#6c757d11); padding: 40px 0; }
			.card-hover:hover { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
		</style>
	</head>
	<body>
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-12 text-center mb-4">
					<h1 class="display-6 fw-bold">Bank CRM System</h1>
					<p class="text-muted">Admin dashboard & complaint management</p>
				</div>

				<div class="col-lg-6 col-md-8">
					<div class="card shadow-sm mb-4">
						<div class="card-body">
							<h5 class="card-title">Admin Login</h5>
							<form method="post" action="/login/">
								<div class="mb-3">
									<label for="username" class="form-label">Username</label>
									<input type="text" class="form-control" id="username" name="username" placeholder="admin" required>
								</div>
								<div class="mb-3">
									<label for="password" class="form-label">Password</label>
									<input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
								</div>
								<div class="d-flex justify-content-between align-items-center">
									<div class="form-check">
										<input class="form-check-input" type="checkbox" value="" id="remember">
										<label class="form-check-label" for="remember">Remember me</label>
									</div>
									<button type="submit" class="btn btn-primary">Login</button>
								</div>
							</form>
						</div>
					</div>
				</div>

				<div class="col-12">
					<div class="row g-4">
						<div class="col-md-6">
							<div class="card card-hover h-100">
								<div class="card-body d-flex flex-column">
									<h5 class="card-title">New Complaint</h5>
									<p class="card-text text-muted">Register a new customer complaint and assign to support staff.</p>
									<a href="/newcomplaint/" class="btn btn-outline-primary mt-auto">Create Complaint</a>
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="card card-hover h-100">
								<div class="card-body d-flex flex-column">
									<h5 class="card-title">View Complaints</h5>
									<p class="card-text text-muted">Browse, filter and manage existing complaints.</p>
									<a href="/complistform/" class="btn btn-outline-secondary mt-auto">View List</a>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="col-12 text-center mt-5">
					<hr>
					<p class="text-muted small mb-0">&copy; 2026 SohamGlobal — All rights reserved.</p>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
