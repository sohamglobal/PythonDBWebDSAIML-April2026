<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        function show()
        {
            ct=document.getElementById("ct").value;
            document.getElementById("info").textContent="You selected "+ct;
        }
    </script>
</head>
<body style="margin-top: 30px;">
    <div class="container">
        <h1 class="display-5">JavaScript with DDL</h1>
        <hr>
        <form>
            <table>
                <tr>
                <td>City</td>
                <td>
                    <select id="ct" class="form-control" onchange="show()">
                        <option value="mumbai">Mumbai</option>
                        <option value="london">London</option>
                        <option value="tokyo">Tokyo</option>
                        <option value="amster">Amsterdam</option>
                        <option value="paris">Paris</option>
                    </select>
                </td>
            </tr>
            </table>
           
        </form>


        <div id="info"></div>

    </div>
    
</body>
</html>
