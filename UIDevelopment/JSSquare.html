<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script>
        function calcSquare()
        {
            n=document.getElementById("num").value;
            sq=n*n;
            //document.write("Square is "+sq)
            document.getElementById("res").textContent="Square is "+sq
        }
    </script>

</head>
<body style="margin-top: 30px;">
    <div class="container">
        <h1 class="display-4">Square Calculator</h1>
        <hr>
        <form name="frm">
            Number <input type="number" name="num" id="num">
            <input type="button" value="Calculate" onclick="calcSquare()">
        </form>

        <br>
        <span id="res" style="color:blueviolet;font-weight: bold;"></span>

    </div>
    
</body>
</html>
