<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="margin-top: 30px;">
    <div class="container">
    <h1 class="display-4">User Registration Form</h1>
    <hr>
    <form name="frm" method="POST" action="register.py">
        <table class="table">
            <tr>
                <td>UserID</td>
                <td><input type="text" name="uid" class="form-control"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="psw" class="form-control"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>
            <tr>
                <td>City</td>
                <td>
                    <select name="ct" class="form-control">
                        <option value="mumbai">Mumbai</option>
                        <option value="london">London</option>
                        <option value="tokyo">Tokyo</option>
                        <option value="amster">Amsterdam</option>
                        <option value="paris">Paris</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Joining Date</td>
                <td>
                    <input type="date" name="jdt" class="form-control">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Register" class="btn btn-outline-info">
                </td>
            </tr>

        </table>
        
        
        

    </form>
    </div>
</body>
</html>
